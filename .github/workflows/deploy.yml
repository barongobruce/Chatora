name: Deploy Skyzen Chat to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skyzen-chat/package-lock.json

      - name: Install dependencies
        working-directory: skyzen-chat
        run: npm ci

      - name: Build Vite application
        working-directory: skyzen-chat
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: skyzen-chat/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4